# ai-polish validates the bearer token with Auth.getUser(token), then verifies
# active staff membership. The legacy-secret-only gateway rejects newer JWTs.
[functions.ai-polish]
verify_jwt = false

# This function separately verifies an active admin/deputy through Auth.
[functions.admin-reset-password]
verify_jwt = false

# Family management verifies an active admin; parent login verifies credentials.
[functions.academy-family]
verify_jwt = false
[functions.academy-parent-login]
verify_jwt = false

# These endpoints verify the bearer token and active staff role internally.
[functions.admin-create-user]
verify_jwt = false
[functions.admin-delete-user]
verify_jwt = false
[functions.academy-ai]
verify_jwt = false
